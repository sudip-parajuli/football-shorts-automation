name: World Cup Daily Content

# The 2026 World Cup (USA/Canada/Mexico) finished on July 19, 2026. The next FIFA
# World Cup is in 2030 (Morocco/Portugal/Spain), so the daily `schedule:` cron trigger
# below is disabled to stop burning CI minutes generating off-season content —
# `worldcup_pipeline.py`'s own date gate (WC_START/WC_END) would have exited cleanly
# anyway, but only after paying for checkout + npm install + Playwright install every
# run. Re-enable the `schedule:` block below (uncomment it) roughly 1-2 months before
# the 2030 tournament kicks off, and update WC_START/WC_END in worldcup_pipeline.py to
# the confirmed 2030 match dates once FIFA announces them.
#
# schedule:
#   # 8am UTC — morning fact/quiz
#   - cron: '0 8 * * *'
#   # 8pm UTC — evening recap/preview
#   - cron: '0 20 * * *'

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Content category to produce'
        required: true
        default: 'wc_fact'
        type: choice
        options:
          - wc_quiz
          - wc_fact
          - wc_group_preview
          - wc_player_spotlight
          - wc_history
      skip_upload:
        description: 'Generate video but skip YouTube upload (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  worldcup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        pip install -r footybitez/requirements.txt
        pip install python-dotenv

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: remotion-video/package-lock.json

    - name: Install Remotion dependencies
      run: |
        cd remotion-video
        npm install

    - name: Install system browser dependencies
      run: |
        cd remotion-video
        npx playwright install-deps chromium

    - name: Install Playwright browser
      run: |
        cd remotion-video
        npx playwright install chromium

    - name: Run World Cup Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
        GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
        GOOGLE_CLOUD_TTS_API_KEY2: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY2 }}
        HUME_API_KEY_LONG_1: ${{ secrets.HUME_API_KEY_LONG_1 }}
        HUME_API_KEY_LONG_2: ${{ secrets.HUME_API_KEY_LONG_2 }}
        HUME_API_KEY_LONG_3: ${{ secrets.HUME_API_KEY_LONG_3 }}
        HUME_API_KEY_LONG_4: ${{ secrets.HUME_API_KEY_LONG_4 }}
        HUME_API_KEY_LONG_5: ${{ secrets.HUME_API_KEY_LONG_5 }}
        HUME_API_KEY_SHORT_1: ${{ secrets.HUME_API_KEY_SHORT_1 }}
        HUME_API_KEY_SHORT_2: ${{ secrets.HUME_API_KEY_SHORT_2 }}
        HUME_API_KEY_SHORT_3: ${{ secrets.HUME_API_KEY_SHORT_3 }}
        HUME_API_KEY_SHORT_4: ${{ secrets.HUME_API_KEY_SHORT_4 }}
        HUME_API_KEY_SHORT_5: ${{ secrets.HUME_API_KEY_SHORT_5 }}
        HUME_VOICE_ID: ${{ secrets.HUME_VOICE_ID }}
        ENABLE_UPLOAD: ${{ github.event.inputs.skip_upload == 'true' && 'false' || 'true' }}
        ENABLE_SOCIAL_PUBLISHING: ${{ github.event.inputs.skip_upload == 'true' && 'false' || 'true' }}
        META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        FOOTYBITEZ_META_ACCESS_TOKEN: ${{ secrets.FOOTYBITEZ_META_ACCESS_TOKEN }}
        FOOTYBITEZ_FACEBOOK_PAGE_ID: ${{ secrets.FOOTYBITEZ_FACEBOOK_PAGE_ID }}
        FOOTYBITEZ_INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.FOOTYBITEZ_INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |
        export PYTHONPATH=$PYTHONPATH:.
        CATEGORY="${{ github.event.inputs.category || 'wc_fact' }}"
        echo "Running category: $CATEGORY"
        python -m footybitez.pipelines.worldcup_pipeline --category "$CATEGORY"

    - name: Dump Python Logs
      if: always()
      run: |
        LATEST_LOG=$(ls -t footybitez/logs/*.log 2>/dev/null | head -1)
        if [ -n "$LATEST_LOG" ]; then
          echo "=== Log: $LATEST_LOG ==="
          cat "$LATEST_LOG"
        fi

    - name: Upload Generated Video
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: worldcup-video
        path: footybitez/output/
