name: Install video inspection tools
description: Install and verify system FFmpeg and ffprobe before content generation
runs:
  using: composite
  steps:
    - name: Install FFmpeg and ffprobe
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
          sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
        fi
        command -v ffmpeg
        command -v ffprobe
        ffmpeg -version
        ffprobe -version
